name: SINAC MAPFRE pilot

on:
  push:
    branches:
      - sinac-mapfre-pilot

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official SINAC 2023 CSV and compute pilot aggregates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, sys, urllib.request
          import pandas as pd

          url = "https://repodatos.atdt.gob.mx/all_data/secretaria_salud/77c166cc-bcbf-4b28-806e-f2a60c3de821/2023_Nacimientos_2023.csv"
          fn = "Nacimientos_2023.csv"

          print("Downloading official SINAC 2023 CSV...", flush=True)
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=120) as r, open(fn, "wb") as f:
              while True:
                  chunk = r.read(1024*1024)
                  if not chunk:
                      break
                  f.write(chunk)
          print("downloaded_bytes", os.path.getsize(fn), flush=True)

          cols = [
              "EDADGESTACIONAL","RESOLUCIONEMBARAZO","TIPOCESAREA",
              "PRODUCTOEMBARAZO","CLUES","APGAR","SILVERMAN","LUGARNACIMIENTO"
          ]
          df = pd.read_csv(fn, usecols=cols, low_memory=False, dtype={"CLUES":"string"})
          print("rows", len(df))
          print("columns", list(df.columns))

          print("\n=== RESOLUCIONEMBARAZO raw counts ===")
          print(df["RESOLUCIONEMBARAZO"].value_counts(dropna=False).sort_index().to_string())

          print("\n=== TIPOCESAREA raw counts (all births) ===")
          print(df["TIPOCESAREA"].value_counts(dropna=False).sort_index().to_string())

          ces = df[df["RESOLUCIONEMBARAZO"] == 3].copy()
          print("\ncesarean_rows", len(ces))
          print("\n=== TIPOCESAREA raw counts among cesareans ===")
          print(ces["TIPOCESAREA"].value_counts(dropna=False).sort_index().to_string())

          print("\n=== TIPOCESAREA x RESOLUCIONEMBARAZO ===")
          print(pd.crosstab(df["TIPOCESAREA"], df["RESOLUCIONEMBARAZO"], dropna=False).to_string())

          term = ces[ces["EDADGESTACIONAL"].between(37,41, inclusive="both")].copy()
          print("\nterm_cesarean_rows_37_41", len(term))
          print("\n=== TIPOCESAREA x gestational week among cesareans 37-41 ===")
          print(pd.crosstab(term["TIPOCESAREA"], term["EDADGESTACIONAL"], dropna=False).to_string())

          print("\n=== Gestational week distribution among cesareans (all codes) ===")
          print(ces["EDADGESTACIONAL"].value_counts(dropna=False).sort_index().to_string())

          print("\n=== PRODUCTOEMBARAZO raw counts ===")
          print(df["PRODUCTOEMBARAZO"].value_counts(dropna=False).sort_index().to_string())

          cl = df["CLUES"].astype("string").str.strip()
          invalid = cl.isna() | cl.eq("") | cl.eq("9998")
          print("\nclues_missing_na", int(cl.isna().sum()))
          print("clues_9998", int(cl.eq("9998").sum()))
          print("clues_empty", int(cl.eq("").sum()))
          print("clues_valid_rows", int((~invalid).sum()))
          print("clues_unique_valid", int(cl[~invalid].nunique()))

          # Facility volumes for cesareans by raw TIPOCESAREA code.
          ces_cl = ces["CLUES"].astype("string").str.strip()
          ces_valid = ces[~(ces_cl.isna() | ces_cl.eq("") | ces_cl.eq("9998"))].copy()
          print("\ncesarean_rows_valid_clues", len(ces_valid))
          print("cesarean_unique_valid_clues", int(ces_valid["CLUES"].nunique()))

          for code in sorted(ces_valid["TIPOCESAREA"].dropna().unique().tolist()):
              sub = ces_valid[ces_valid["TIPOCESAREA"] == code]
              vols = sub.groupby("CLUES").size()
              print(f"\n=== Facility volumes for cesarean TIPOCESAREA={code} ===")
              print("facilities_any", int(len(vols)))
              for threshold in [10,20,30,50,100,200]:
                  print(f"facilities_ge_{threshold}", int((vols >= threshold).sum()))

          # Raw timing indicators for each observed cesarean type code.
          print("\n=== Raw early-term timing by TIPOCESAREA code ===")
          for code in sorted(term["TIPOCESAREA"].dropna().unique().tolist()):
              sub = term[term["TIPOCESAREA"] == code]
              early = sub["EDADGESTACIONAL"].isin([37,38]).sum()
              print("code", code, "n_term_37_41", len(sub),
                    "n_37_38", int(early),
                    "pct_37_38", round(100*early/len(sub),3) if len(sub) else None)

          # Candidate singleton code(s): report timing by PRODUCTOEMBARAZO raw code
          print("\n=== Cesarean timing by PRODUCTOEMBARAZO and TIPOCESAREA raw codes (37-41) ===")
          tab = term.groupby(["PRODUCTOEMBARAZO","TIPOCESAREA","EDADGESTACIONAL"]).size()
          print(tab.to_string())

          # Neonatal adaptation descriptive validation
          print("\n=== APGAR<7 and SILVERMAN>0 by TIPOCESAREA and GA, cesareans 37-41 ===")
          agg = term.groupby(["TIPOCESAREA","EDADGESTACIONAL"]).agg(
              n=("APGAR","size"),
              apgar_lt7=("APGAR", lambda s: int(((s < 7) & (s != 99)).sum())),
              apgar_valid=("APGAR", lambda s: int((s != 99).sum())),
              silverman_gt0=("SILVERMAN", lambda s: int(((s > 0) & (s != 99)).sum())),
              silverman_valid=("SILVERMAN", lambda s: int((s != 99).sum()))
          )
          print(agg.to_string())

          os.remove(fn)
          print("\nPilot complete; downloaded row-level file removed from runner workspace.")
          PY
