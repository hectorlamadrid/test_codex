name: SINAC MAPFRE facility pilot

on:
  push:
    branches:
      - sinac-mapfre-pilot

jobs:
  facility_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install analysis packages
        run: python -m pip install --quiet pandas numpy scipy statsmodels
      - name: Analyze facility-level variation
        shell: bash
        env:
          SINAC_ZIP_URL_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request, zipfile, math
          import numpy as np
          import pandas as pd
          from scipy.stats import spearmanr
          import statsmodels.api as sm

          import base64
          url = base64.b64decode(os.environ["SINAC_ZIP_URL_B64"]).decode("utf-8")
          zfn = "sinac_2023.zip"

          print("Downloading trusted SINAC 2023 ZIP copy...", flush=True)
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=180) as r, open(zfn, "wb") as f:
              while True:
                  chunk = r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
          print("downloaded_zip_bytes", os.path.getsize(zfn), flush=True)

          with zipfile.ZipFile(zfn) as z:
              csvs = [m for m in z.infolist() if (not m.is_dir()) and m.filename.lower().endswith(".csv")]
              if not csvs:
                  raise RuntimeError("No CSV found in ZIP")
              target = max(csvs, key=lambda m: m.file_size)
              z.extract(target, ".")
              fn = target.filename
              print("selected_csv", target.filename, target.file_size)

          cols = [
              "EDAD","NUMEROEMBARAZOS","EDADGESTACIONAL",
              "RESOLUCIONEMBARAZO","TIPOCESAREA",
              "PRODUCTOEMBARAZO","CLUES","ENTIDADFEDERATIVAPARTO"
          ]
          df = pd.read_csv(fn, usecols=cols, low_memory=False, dtype={"CLUES":"string"})
          print("rows", len(df))

          cl = df["CLUES"].astype("string").str.strip()
          valid_clues = ~(cl.isna() | cl.eq("") | cl.eq("9998"))

          # Primary pilot population:
          # singleton + cesarean + programmed + term (37-41) + valid facility ID
          a = df[
              (df["PRODUCTOEMBARAZO"] == 1) &
              (df["RESOLUCIONEMBARAZO"] == 3) &
              (df["TIPOCESAREA"] == 1) &
              (df["EDADGESTACIONAL"].between(37,41, inclusive="both")) &
              valid_clues
          ].copy()
          a["early"] = a["EDADGESTACIONAL"].isin([37,38]).astype(int)

          print("\n=== PRIMARY POPULATION ===")
          print("singleton_programmed_term_valid_clues_n", len(a))
          print("early_37_38_n", int(a["early"].sum()))
          print("overall_early_pct", round(100*a["early"].mean(),3))
          print("unique_facilities", int(a["CLUES"].nunique()))

          fac = a.groupby("CLUES").agg(
              n=("early","size"),
              early=("early","sum")
          )
          fac["rate"] = fac["early"]/fac["n"]

          def describe_subset(label, f):
              print(f"\n=== FACILITY DISTRIBUTION: {label} ===")
              print("facilities", len(f))
              print("births", int(f["n"].sum()))
              if len(f)==0: return
              q = f["rate"].quantile([0,0.01,0.05,0.10,0.25,0.50,0.75,0.90,0.95,0.99,1])
              for idx,val in q.items():
                  print(f"rate_q_{idx:.2f}", round(100*float(val),3))
              print("unweighted_mean_pct", round(100*f["rate"].mean(),3))
              print("unweighted_sd_pct", round(100*f["rate"].std(ddof=1),3))
              print("facilities_lt20pct", int((f["rate"] < .20).sum()))
              print("facilities_20_40pct", int(((f["rate"] >= .20) & (f["rate"] < .40)).sum()))
              print("facilities_40_60pct", int(((f["rate"] >= .40) & (f["rate"] < .60)).sum()))
              print("facilities_60_80pct", int(((f["rate"] >= .60) & (f["rate"] < .80)).sum()))
              print("facilities_ge80pct", int((f["rate"] >= .80).sum()))
              if len(f)>2:
                  rho,p=spearmanr(f["n"], f["rate"])
                  print("spearman_volume_rate_rho", round(float(rho),4))
                  print("spearman_volume_rate_p", f"{p:.3g}")

          for threshold in [20,30,50,100,200]:
              describe_subset(f"n>={threshold}", fac[fac["n"]>=threshold].copy())

          # Is observed between-facility spread larger than simple binomial noise?
          pbar = a["early"].mean()
          for threshold in [30,50,100]:
              f = fac[fac["n"]>=threshold].copy()
              denom = f["n"] * pbar * (1-pbar)
              pearson_components = ((f["early"] - f["n"]*pbar)**2 / denom)
              phi = pearson_components.sum() / max(len(f)-1,1)
              se = np.sqrt(pbar*(1-pbar)/f["n"])
              z = (f["rate"]-pbar)/se
              print(f"\n=== HETEROGENEITY vs binomial noise, n>={threshold} ===")
              print("dispersion_phi", round(float(phi),3))
              print("facilities_abs_z_ge2", int((np.abs(z)>=2).sum()))
              print("facilities_abs_z_ge3", int((np.abs(z)>=3).sum()))
              print("facilities_total", len(f))

          # Conservative case-mix model:
          # maternal age (linear+quadratic) + pregnancy-number category.
          # Do not adjust for gestational age because it defines the outcome.
          cc = a[
              a["EDAD"].between(12,55, inclusive="both") &
              a["NUMEROEMBARAZOS"].between(1,20, inclusive="both")
          ].copy()
          cc["age_c"] = cc["EDAD"] - cc["EDAD"].mean()
          cc["age_c2"] = cc["age_c"]**2
          cc["grav2"] = (cc["NUMEROEMBARAZOS"]==2).astype(int)
          cc["grav3"] = (cc["NUMEROEMBARAZOS"]==3).astype(int)
          cc["grav4p"] = (cc["NUMEROEMBARAZOS"]>=4).astype(int)

          X = cc[["age_c","age_c2","grav2","grav3","grav4p"]]
          X = sm.add_constant(X, has_constant="add")
          model = sm.GLM(cc["early"], X, family=sm.families.Binomial()).fit()
          cc["pred"] = model.predict(X)

          print("\n=== CASE-MIX MODEL ===")
          print("complete_case_n", len(cc))
          print("complete_case_pct_of_primary", round(100*len(cc)/len(a),3))
          print("coefficients")
          for k,v in model.params.items():
              print(k, round(float(v),6))

          sf = cc.groupby("CLUES").agg(
              n=("early","size"),
              obs=("early","sum"),
              exp=("pred","sum")
          )
          national = cc["early"].mean()
          sf["obs_rate"] = sf["obs"]/sf["n"]
          sf["std_rate"] = np.where(sf["exp"]>0, (sf["obs"]/sf["exp"])*national, np.nan)

          for threshold in [30,50,100,200]:
              f=sf[sf["n"]>=threshold].copy()
              print(f"\n=== CASE-MIX STANDARDIZED FACILITY RATES, n>={threshold} ===")
              print("facilities", len(f))
              print("births", int(f["n"].sum()))
              q=f["std_rate"].quantile([0.01,0.05,0.10,0.25,0.50,0.75,0.90,0.95,0.99])
              for idx,val in q.items():
                  print(f"std_rate_q_{idx:.2f}", round(100*float(val),3))
              print("std_unweighted_sd_pct", round(100*f["std_rate"].std(ddof=1),3))
              print("std_facilities_lt30pct", int((f["std_rate"]<.30).sum()))
              print("std_facilities_ge70pct", int((f["std_rate"]>=.70).sum()))
              print("raw_vs_std_corr", round(float(f[["obs_rate","std_rate"]].corr().iloc[0,1]),4))

          # State-level context (aggregated only)
          st = a.groupby("ENTIDADFEDERATIVAPARTO").agg(
              n=("early","size"), early=("early","sum"), facilities=("CLUES","nunique")
          )
          st["rate"]=st["early"]/st["n"]
          print("\n=== STATE-LEVEL CONTEXT (valid states 1-32) ===")
          st=st.loc[st.index.to_series().between(1,32)]
          print("state_count", len(st))
          print("state_rate_min_pct", round(100*st["rate"].min(),3))
          print("state_rate_median_pct", round(100*st["rate"].median(),3))
          print("state_rate_max_pct", round(100*st["rate"].max(),3))
          print("states_ge50pct", int((st["rate"]>=.50).sum()))
          print("states_ge60pct", int((st["rate"]>=.60).sum()))

          try: os.remove(fn)
          except: pass
          os.remove(zfn)
          print("\nFacility pilot complete; row-level files removed from ephemeral runner workspace.")
          PY
